<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b11"/>
      <stop offset="50%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#12182b"/>
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>

    <!-- Radial Glow Behind Logo -->
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090b11" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Clean Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.025"/>
    </pattern>

    <!-- Card Border -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#cba6f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="640" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="20" fill="url(#grid)"/>

  <!-- Logo Ambient Glow -->
  <circle cx="265" cy="320" r="280" fill="url(#logoGlow)"/>

  <!-- Card Border -->
  <rect width="1278" height="638" x="1" y="1" rx="19" fill="none" stroke="url(#borderGradient)" stroke-width="1.5"/>

  <!-- Left: Brand Logo (Vertically Centered at cy=320) -->
  <g transform="translate(90, 145)">
    <!-- Decorative Outer Orbit Ring (r=175) -->
    <circle cx="175" cy="175" r="168" fill="none" stroke="#89b4fa" stroke-width="1.5" opacity="0.22" stroke-dasharray="8 8"/>

    <!-- Primary Display Ring (r=130, stroke=40) -->
    <circle cx="175" cy="175" r="130" fill="none" stroke="url(#logoGrad)" stroke-width="40"/>

    <!-- Extension Orbiting Display Dot (r=48) -->
    <circle cx="267" cy="267" r="48" fill="url(#logoGrad)"/>
    <circle cx="267" cy="267" r="48" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Right: Typography & Feature Pills (Vertically Centered) -->
  <g transform="translate(490, 140)">
    <!-- Main Title: ORBISCREEN -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="94" font-weight="900" fill="#ffffff" letter-spacing="-2">
      ORBI<tspan fill="url(#brandBlue)">SCREEN</tspan>
    </text>

    <!-- Subtitle: High-Contrast & Readable at Any Scale -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">
      Turn Android into a Second Monitor for Linux
    </text>

    <!-- Description Details -->
    <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="-0.2">
      Ultra-low latency · Wi-Fi &amp; USB · Multi-Touch &amp; Stylus Digitizer
    </text>

    <!-- Feature Pills (Large, Crisp & Modern) -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: Low Latency -->
      <g transform="translate(0, 0)">
        <rect width="195" height="54" rx="14" fill="#131728" stroke="#38bdf8" stroke-width="1.6"/>
        <svg x="18" y="15" width="24" height="24" viewBox="0 0 24 24" fill="#38bdf8">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <text x="54" y="28" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="700" fill="#38bdf8">Low Latency</text>
      </g>

      <!-- Pill 2: Wayland & X11 -->
      <g transform="translate(212, 0)">
        <rect width="216" height="54" rx="14" fill="#131728" stroke="#4ade80" stroke-width="1.6"/>
        <svg x="18" y="15" width="24" height="24" viewBox="0 0 24 24" fill="#4ade80">
          <path d="M 20 3 L 4 3 C 2.9 3 2 3.9 2 5 L 2 15 C 2 16.1 2.9 17 4 17 L 10 17 L 10 19 L 7 19 C 6.4 19 6 19.4 6 20 C 6 20.6 6.4 21 7 21 L 17 21 C 17.6 21 18 20.6 18 20 C 18 19.4 17.6 19 17 19 L 14 19 L 14 17 L 20 17 C 21.1 17 22 16.1 22 15 L 22 5 C 22 3.9 21.1 3 20 3 Z M 20 15 L 4 15 L 4 5 L 20 5 L 20 15 Z"/>
        </svg>
        <text x="54" y="28" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="700" fill="#4ade80">Wayland &amp; X11</text>
      </g>

      <!-- Pill 3: Stylus & Touch -->
      <g transform="translate(444, 0)">
        <rect width="220" height="54" rx="14" fill="#131728" stroke="#facc15" stroke-width="1.6"/>
        <svg x="18" y="15" width="24" height="24" viewBox="0 0 24 24" fill="#facc15">
          <path d="M 3 17.25 V 21 h 3.75 L 17.81 9.94 l -3.75 -3.75 L 3 17.25 Z M 20.71 7.04 c 0.39 -0.39 0.39 -1.02 0 -1.41 l -2.34 -2.34 c -0.39 -0.39 -1.02 -0.39 -1.41 0 l -1.83 1.83 3.75 3.75 1.83 -1.83 Z"/>
        </svg>
        <text x="54" y="28" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="700" fill="#facc15">Stylus &amp; Touch</text>
      </g>
    </g>
  </g>
</svg>
