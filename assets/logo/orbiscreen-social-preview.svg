<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient (Exact from orbiscreen-banner.svg) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="60%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#181c2e"/>
    </linearGradient>

    <!-- Crisp Brand Gradients (Exact from orbiscreen-banner.svg) -->
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>

    <!-- Border Gradient (Exact from orbiscreen-banner.svg) -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#cba6f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Subtle Clean Grid Pattern (Exact from orbiscreen-banner.svg) -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.025"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="640" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="16" fill="url(#grid)"/>

  <!-- Clean Border Outline -->
  <rect width="1278" height="638" x="1" y="1" rx="15" fill="none" stroke="url(#borderGradient)" stroke-width="1.2"/>

  <!-- Left: Brand Logo Group (Vertically Centered at cy=320) -->
  <g transform="translate(85, 140)">
    <!-- Decorative outer ring -->
    <circle cx="180" cy="180" r="168" fill="none" stroke="#89b4fa" stroke-width="1.4" opacity="0.15" stroke-dasharray="8 8"/>

    <!-- Primary Display Ring -->
    <circle cx="180" cy="180" r="132" fill="none" stroke="url(#brandBlue)" stroke-width="38"/>

    <!-- Extension Screen Dot (The Orbiting Display) -->
    <circle cx="273" cy="273" r="48" fill="url(#brandBlue)"/>
    <circle cx="273" cy="273" r="48" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.4"/>
  </g>

  <!-- Right: Title, Subtitle, and Feature Pills (Vertically Centered at cy=320) -->
  <g transform="translate(480, 150)">
    <!-- Main Title: Exact font, weights, and colors from banner -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="900" fill="#ffffff" letter-spacing="-2">
      ORBI<tspan fill="url(#brandBlue)">SCREEN</tspan>
    </text>

    <!-- Subtitle: Exact text and color from banner (#cdd6f4) -->
    <text x="0" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#cdd6f4" letter-spacing="-0.3">
      Turn any Android tablet or phone into a second monitor for Linux
    </text>

    <!-- Description Details: Exact text and color from banner (#a6adc8) -->
    <text x="0" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a6adc8">
      Open-source · Wayland &amp; X11 · Low-latency · Stylus &amp; Touch
    </text>

    <!-- Feature Pills: Exact colors (#181a27, #89b4fa, #a6e3a1, #f9e2af) -->
    <g transform="translate(0, 226)">

      <!-- Pill 1: Latency -->
      <g transform="translate(0, 0)">
        <rect width="180" height="48" rx="12" fill="#181a27" stroke="#89b4fa" stroke-width="1.4"/>
        <svg x="20" y="14" width="20" height="20" viewBox="0 0 24 24" fill="#89b4fa">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <text x="50" y="24" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#89b4fa">Low Latency</text>
      </g>

      <!-- Pill 2: Wayland & X11 -->
      <g transform="translate(200, 0)">
        <rect width="200" height="48" rx="12" fill="#181a27" stroke="#a6e3a1" stroke-width="1.4"/>
        <svg x="20" y="14" width="20" height="20" viewBox="0 0 24 24" fill="#a6e3a1">
          <path d="M 20 3 L 4 3 C 2.9 3 2 3.9 2 5 L 2 15 C 2 16.1 2.9 17 4 17 L 10 17 L 10 19 L 7 19 C 6.4 19 6 19.4 6 20 C 6 20.6 6.4 21 7 21 L 17 21 C 17.6 21 18 20.6 18 20 C 18 19.4 17.6 19 17 19 L 14 19 L 14 17 L 20 17 C 21.1 17 22 16.1 22 15 L 22 5 C 22 3.9 21.1 3 20 3 Z M 20 15 L 4 15 L 4 5 L 20 5 L 20 15 Z"/>
        </svg>
        <text x="50" y="24" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#a6e3a1">Wayland &amp; X11</text>
      </g>

      <!-- Pill 3: Stylus & Touch -->
      <g transform="translate(420, 0)">
        <rect width="200" height="48" rx="12" fill="#181a27" stroke="#f9e2af" stroke-width="1.4"/>
        <svg x="20" y="14" width="20" height="20" viewBox="0 0 24 24" fill="#f9e2af">
          <path d="M 3 17.25 V 21 h 3.75 L 17.81 9.94 l -3.75 -3.75 L 3 17.25 Z M 20.71 7.04 c 0.39 -0.39 0.39 -1.02 0 -1.41 l -2.34 -2.34 c -0.39 -0.39 -1.02 -0.39 -1.41 0 l -1.83 1.83 3.75 3.75 1.83 -1.83 Z"/>
        </svg>
        <text x="50" y="24" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#f9e2af">Stylus &amp; Touch</text>
      </g>

    </g>
  </g>
</svg>
